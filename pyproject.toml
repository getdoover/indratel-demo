[project]
name = "indratel-demo"
version = "0.1.0"
description = "Site overview widget for the Indratel demo device"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydoover>=1.0.0a8",
]

[project.scripts]
export-config = "indratel_demo.app_config:export"
export-ui = "indratel_demo.app_ui:export"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/indratel_demo"]

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "pytest-asyncio>=0.26.0",
]
